<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO — 360° Sound Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #060a09;
    --panel: #0c1512;
    --grid: #163326;
    --grid-strong: #1f4433;
    --phosphor: #3dffa8;
    --phosphor-dim: #1f7a56;
    --amber: #ffb020;
    --text: #e6f5ee;
    --text-dim: #6f9d8a;
    --ring-glow: 0 0 18px rgba(61,255,168,0.35);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    overflow: hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    height:100vh;
    background:
      radial-gradient(ellipse at 50% 15%, rgba(61,255,168,0.06), transparent 60%),
      var(--bg);
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding: 20px 28px 0 28px;
    flex-shrink:0;
  }

  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .brand .mark{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: var(--text);
  }
  .brand .mark span{ color: var(--phosphor); }

  .brand .sub{
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .headphone-note{
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--amber);
    text-transform: uppercase;
    border: 1px solid rgba(255,176,32,0.35);
    padding: 7px 12px;
    border-radius: 2px;
    background: rgba(255,176,32,0.05);
    text-align:right;
    max-width: 220px;
  }

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    min-height:0;
    padding: 10px 20px;
  }

  .field-wrap{
    position:relative;
    width: min(62vh, 62vw, 560px);
    height: min(62vh, 62vw, 560px);
  }

  .sweep{
    position:absolute;
    inset:0;
    border-radius:50%;
    overflow:hidden;
    animation: spin 6s linear infinite;
    pointer-events:none;
    opacity:0.9;
  }
  .sweep::before{
    content:"";
    position:absolute;
    inset:0;
    background: conic-gradient(from 0deg,
      rgba(61,255,168,0.28) 0deg,
      rgba(61,255,168,0.10) 18deg,
      rgba(61,255,168,0.0) 55deg,
      rgba(61,255,168,0.0) 360deg);
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce){
    .sweep{ animation: none; }
  }

  svg.field{
    position:relative;
    width:100%;
    height:100%;
    display:block;
    cursor: crosshair;
    z-index:2;
  }

  .ring{ fill:none; stroke: var(--grid); stroke-width:1; }
  .ring.outer{ stroke: var(--grid-strong); }
  .crosshair{ stroke: var(--grid); stroke-width:1; }
  .tick-label{
    fill: var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
  }

  .listener{
    fill: var(--bg);
    stroke: var(--phosphor);
    stroke-width: 2;
  }
  .listener-dot{
    fill: var(--phosphor);
  }

  .blip circle.core{
    fill: var(--phosphor);
  }
  .blip circle.ring{
    fill:none;
    stroke: var(--phosphor);
    stroke-width: 2;
  }

  .readout{
    flex-shrink:0;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding: 0 28px 22px 28px;
    gap: 20px;
  }

  .stats{
    display:flex;
    gap: 28px;
  }

  .stat{
    display:flex;
    flex-direction:column;
    gap:3px;
    min-width: 74px;
  }
  .stat .label{
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--text-dim);
    text-transform:uppercase;
  }
  .stat .value{
    font-family:'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--phosphor);
    font-variant-numeric: tabular-nums;
  }

  .presets{
    display:flex;
    gap: 8px;
  }

  .preset-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--grid-strong);
    border-radius: 2px;
    padding: 9px 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .preset-btn:hover{
    color: var(--text);
    border-color: var(--phosphor-dim);
  }
  .preset-btn.active{
    color: var(--bg);
    background: var(--phosphor);
    border-color: var(--phosphor);
    font-weight: 600;
  }
  .preset-btn:focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  .hint{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    text-align:center;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    pointer-events:none;
    z-index:1;
    max-width: 200px;
    line-height:1.6;
  }
  .hint.hidden{ display:none; }

  @media (max-width: 640px){
    header{ flex-direction:column; gap:12px; }
    .headphone-note{ max-width:none; text-align:left; }
    .readout{ flex-direction:column; align-items:flex-start; gap:14px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">ECHO<span>FIELD</span></div>
    <div class="sub">360° binaural sound &mdash; click to place a source</div>
  </div>
  <div class="headphone-note">⚠ Headphones required<br>for spatial effect</div>
</header>

<main>
  <div class="field-wrap">
    <div class="sweep"></div>
    <svg class="field" viewBox="0 0 560 560" role="img" aria-label="Circular sound field. Click anywhere to hear a sound from that direction.">
      <circle class="ring outer" cx="280" cy="280" r="260"></circle>
      <circle class="ring" cx="280" cy="280" r="195"></circle>
      <circle class="ring" cx="280" cy="280" r="130"></circle>
      <circle class="ring" cx="280" cy="280" r="65"></circle>
      <line class="crosshair" x1="280" y1="20" x2="280" y2="540"></line>
      <line class="crosshair" x1="20" y1="280" x2="540" y2="280"></line>
      <text class="tick-label" x="280" y="14" text-anchor="middle">FRONT</text>
      <text class="tick-label" x="280" y="552" text-anchor="middle">BEHIND</text>
      <text class="tick-label" x="8" y="284" text-anchor="start">L</text>
      <text class="tick-label" x="552" y="284" text-anchor="end">R</text>

      <circle class="listener" cx="280" cy="280" r="10"></circle>
      <circle class="listener-dot" cx="280" cy="280" r="2.5"></circle>

      <g id="blips"></g>
    </svg>
    <div class="hint" id="hint">click anywhere<br>inside the field</div>
  </div>
</main>

<div class="readout">
  <div class="stats">
    <div class="stat">
      <div class="label">Bearing</div>
      <div class="value" id="statBearing">&mdash;</div>
    </div>
    <div class="stat">
      <div class="label">Range</div>
      <div class="value" id="statRange">&mdash;</div>
    </div>
    <div class="stat">
      <div class="label">Sound</div>
      <div class="value" id="statSound" style="font-size:14px;">PING</div>
    </div>
  </div>
  <div class="presets" role="group" aria-label="Sound type">
    <button class="preset-btn active" data-preset="ping">Ping</button>
    <button class="preset-btn" data-preset="click">Click</button>
    <button class="preset-btn" data-preset="bell">Bell</button>
  </div>
</div>

<script>
(function(){
  const svg = document.querySelector('svg.field');
  const blipsGroup = document.getElementById('blips');
  const hint = document.getElementById('hint');
  const statBearing = document.getElementById('statBearing');
  const statRange = document.getElementById('statRange');
  const statSound = document.getElementById('statSound');
  const presetBtns = document.querySelectorAll('.preset-btn');

  const CX = 280, CY = 280, MAX_R = 260;
  const AUDIO_MAX_DIST = 6; // meters, at edge of circle

  let currentPreset = 'ping';
  presetBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      presetBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentPreset = btn.dataset.preset;
      statSound.textContent = currentPreset.toUpperCase();
    });
  });

  // ---- Audio setup (lazy) ----
  let ctx = null;
  let master = null;

  function ensureAudio(){
    if(!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(ctx.destination);
      if(ctx.listener){
        if(ctx.listener.forwardX){
          ctx.listener.forwardX.value = 0;
          ctx.listener.forwardY.value = 0;
          ctx.listener.forwardZ.value = -1;
          ctx.listener.upX.value = 0;
          ctx.listener.upY.value = 1;
          ctx.listener.upZ.value = 0;
        } else if(ctx.listener.setOrientation){
          ctx.listener.setOrientation(0,0,-1, 0,1,0);
        }
      }
    }
    if(ctx.state === 'suspended'){ ctx.resume(); }
    return ctx;
  }

  function noiseBuffer(ac, duration){
    const len = Math.floor(ac.sampleRate * duration);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<len;i++){ data[i] = (Math.random()*2-1) * (1 - i/len); }
    return buf;
  }

  function playSound(preset, x, z, distNorm){
    const ac = ensureAudio();
    const now = ac.currentTime;

    const panner = ac.createPanner();
    panner.panningModel = 'HRTF';
    panner.distanceModel = 'inverse';
    panner.refDistance = 0.6;
    panner.maxDistance = 20;
    panner.rolloffFactor = 1.1;
    panner.coneInnerAngle = 360;
    panner.coneOuterAngle = 360;
    panner.coneOuterGain = 0;

    if(panner.positionX){
      panner.positionX.value = x;
      panner.positionY.value = 0;
      panner.positionZ.value = z;
    } else if(panner.setPosition){
      panner.setPosition(x, 0, z);
    }

    // distance-based air absorption filter: closer = brighter, farther = duller
    const lowpass = ac.createBiquadFilter();
    lowpass.type = 'lowpass';
    const cutoff = 14000 - distNorm * 9500; // 14kHz near -> 4.5kHz far
    lowpass.frequency.value = Math.max(1200, cutoff);
    lowpass.Q.value = 0.6;

    const gain = ac.createGain();

    panner.connect(lowpass);
    lowpass.connect(gain);
    gain.connect(master);

    if(preset === 'ping'){
      const osc = ac.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(920, now);
      osc.frequency.exponentialRampToValueAtTime(420, now + 0.18);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.9, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
      osc.connect(gain);
      osc.start(now);
      osc.stop(now + 0.45);
    } else if(preset === 'click'){
      const src = ac.createBufferSource();
      src.buffer = noiseBuffer(ac, 0.06);
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 2200;
      bp.Q.value = 1.2;
      gain.gain.setValueAtTime(0.9, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
      src.connect(bp);
      bp.connect(gain);
      src.start(now);
      src.stop(now + 0.08);
    } else if(preset === 'bell'){
      const freqs = [660, 990, 1650];
      const gains = [0.7, 0.35, 0.18];
      freqs.forEach((f, i)=>{
        const osc = ac.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = f;
        const og = ac.createGain();
        og.gain.setValueAtTime(0.0001, now);
        og.gain.exponentialRampToValueAtTime(gains[i], now + 0.006);
        og.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
        osc.connect(og);
        og.connect(gain);
        osc.start(now);
        osc.stop(now + 1.5);
      });
    }

    // cleanup
    setTimeout(()=>{
      try{ panner.disconnect(); lowpass.disconnect(); gain.disconnect(); }catch(e){}
    }, 2000);
  }

  // ---- Click handling & visuals ----
  function pointFromEvent(evt){
    const rect = svg.getBoundingClientRect();
    const scaleX = 560 / rect.width;
    const scaleY = 560 / rect.height;
    const px = (evt.clientX - rect.left) * scaleX;
    const py = (evt.clientY - rect.top) * scaleY;
    return {px, py};
  }

  function addBlip(px, py){
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'blip');

    const core = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    core.setAttribute('class', 'core');
    core.setAttribute('cx', px);
    core.setAttribute('cy', py);
    core.setAttribute('r', 5);

    const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    ring.setAttribute('class', 'ring');
    ring.setAttribute('cx', px);
    ring.setAttribute('cy', py);
    ring.setAttribute('r', 5);

    g.appendChild(ring);
    g.appendChild(core);
    blipsGroup.appendChild(g);

    const start = performance.now();
    const duration = 900;
    function animate(t){
      const p = Math.min(1, (t - start) / duration);
      const r = 5 + p * 46;
      ring.setAttribute('r', r);
      ring.setAttribute('opacity', 1 - p);
      core.setAttribute('opacity', 1 - p*0.85);
      if(p < 1){
        requestAnimationFrame(animate);
      } else {
        g.remove();
      }
    }
    requestAnimationFrame(animate);
  }

  function handleClick(evt){
    const {px, py} = pointFromEvent(evt);
    const dx = px - CX;
    const dy = py - CY;
    let dist = Math.sqrt(dx*dx + dy*dy);
    if(dist > MAX_R) dist = MAX_R; // clamp visually, but keep true angle

    const clampedDx = (dist/Math.max(1, Math.sqrt(dx*dx+dy*dy))) * dx;
    const clampedDy = (dist/Math.max(1, Math.sqrt(dx*dx+dy*dy))) * dy;

    hint.classList.add('hidden');
    addBlip(CX + clampedDx, CY + clampedDy);

    const distNorm = dist / MAX_R; // 0..1
    const audioX = (dx / MAX_R) * AUDIO_MAX_DIST;
    const audioZ = (dy / MAX_R) * AUDIO_MAX_DIST;

    playSound(currentPreset, audioX, audioZ, distNorm);

    let bearing = Math.atan2(dx, -dy) * (180/Math.PI);
    if(bearing < 0) bearing += 360;
    statBearing.textContent = Math.round(bearing) + '°';
    statRange.textContent = Math.round(distNorm * 100) + '%';
  }

  svg.addEventListener('click', handleClick);
})();
</script>

</body>
</html>
